repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: claude-settings-clean
        name: Check claude settings.json has no machine-specific values
        entry: _tools/check-claude-settings.sh
        language: script
        files: ^claude/\.claude/settings\.json$
        pass_filenames: false
